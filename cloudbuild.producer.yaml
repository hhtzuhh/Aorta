steps:
  # Build producer Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aorta-producer:latest'
      - '-f'
      - 'Dockerfile.producer'
      - '.'
    timeout: 600s

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aorta-producer:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aorta-producer'
      - '--image=gcr.io/$PROJECT_ID/aorta-producer:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--max-instances=1'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--set-env-vars=DB_BUCKET=${_DB_BUCKET}'
      - '--set-env-vars=AORTA_KAFKA_SASL_MECHANISM=PLAIN'
      - '--set-env-vars=AORTA_KAFKA_SECURITY_PROTOCOL=SASL_SSL'
      - '--set-secrets=AORTA_KAFKA_BOOTSTRAP_SERVERS=aorta-kafka-bootstrap-servers:latest'
      - '--set-secrets=AORTA_KAFKA_SASL_USERNAME=aorta-kafka-sasl-username:latest'
      - '--set-secrets=AORTA_KAFKA_SASL_PASSWORD=aorta-kafka-sasl-password:latest'

images:
  - 'gcr.io/$PROJECT_ID/aorta-producer:latest'

timeout: 1200s

substitutions:
  _DB_BUCKET: 'confluent-hack-aorta-database'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
